<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1200" viewBox="0 0 430 1200" role="img" aria-labelledby="title desc">
  <title id="title">Omiryn Style page mobile preview</title>
  <desc id="desc">A mobile preview of the clean two section Style page.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-10%" width="124%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#315c56" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #18221f; }
      .muted { fill: #64736f; }
      .eyebrow { fill: #2f8b73; font-size: 11px; font-weight: 820; letter-spacing: .8px; text-transform: uppercase; }
      .h1 { font-size: 36px; font-weight: 820; }
      .h2 { font-size: 21px; font-weight: 780; }
      .h3 { font-size: 15px; font-weight: 760; }
      .copy { font-size: 14px; }
      .small { font-size: 12px; }
      .xs { font-size: 10px; font-weight: 760; }
      .card { fill: #ffffff; stroke: #dce7e2; stroke-width: 1.2; rx: 8; }
      .soft { fill: #fbfdfc; stroke: #dce7e2; stroke-width: 1.1; rx: 8; }
      .pill { fill: #f2f7f4; stroke: #d8e5df; stroke-width: 1.1; rx: 999; }
      .green { fill: #e9f7f1; stroke: #bfe2d5; stroke-width: 1.1; rx: 999; }
      .amber { fill: #fff7dc; stroke: #ecd896; stroke-width: 1.1; rx: 999; }
      .divider { stroke: #e3ece7; stroke-width: 1.1; }
    </style>
  </defs>

  <rect width="430" height="1200" fill="url(#page)"/>

  <g transform="translate(18 18)">
    <rect width="394" height="70" rx="24" fill="#ffffff" stroke="#e0eae5" filter="url(#shadow)"/>
    <circle cx="33" cy="35" r="15" fill="#1f7664"/>
    <text x="58" y="42" font-size="20" font-weight="840">Omiryn</text>
    <rect x="306" y="20" width="58" height="30" rx="999" fill="#f2f7f4" stroke="#d8e5df"/>
    <text x="322" y="39" class="xs muted">Style</text>
  </g>

  <g transform="translate(22 132)">
    <text class="eyebrow" x="0" y="0">Style</text>
    <text class="h1" x="0" y="46">What Omiryn</text>
    <text class="h1" x="0" y="88">knows.</text>
    <text class="copy muted" x="0" y="126">Review learned signals and add memories that help</text>
    <text class="copy muted" x="0" y="148">Omiryn understand you better.</text>
  </g>

  <g transform="translate(18 320)" filter="url(#shadow)">
    <rect class="card" width="394" height="472"/>
    <g transform="translate(18 26)">
      <text class="eyebrow" x="0" y="0">Learned signals</text>
      <text class="h2" x="0" y="32">Signals learned from chats</text>
      <text class="small muted" x="0" y="58">Grouped by topic for quick review.</text>
      <rect class="pill" x="0" y="78" width="80" height="28"/>
      <text class="xs muted" x="17" y="96">18 signals</text>
    </g>
    <line class="divider" x1="0" y1="148" x2="394" y2="148"/>

    <g transform="translate(16 168)">
      <rect class="card" width="362" height="128"/>
      <text class="h3" x="14" y="30">Values</text>
      <rect class="pill" x="318" y="14" width="28" height="22"/>
      <text class="xs muted" x="328" y="29">5</text>
      <g transform="translate(14 48)">
        <rect class="soft" width="334" height="32"/>
        <text class="small" x="11" y="21" font-weight="700">Prefers honesty over polished answers</text>
        <rect class="green" x="286" y="7" width="38" height="18"/>
        <text class="xs" x="294" y="20" fill="#176049">91%</text>
      </g>
      <g transform="translate(14 88)">
        <rect class="soft" width="334" height="26"/>
        <text class="small muted" x="11" y="18" font-weight="700">Trust grows through consistency</text>
      </g>
    </g>

    <g transform="translate(16 310)">
      <rect class="card" width="362" height="128"/>
      <text class="h3" x="14" y="30">Communication</text>
      <rect class="pill" x="318" y="14" width="28" height="22"/>
      <text class="xs muted" x="328" y="29">7</text>
      <g transform="translate(14 48)">
        <rect class="soft" width="334" height="32"/>
        <text class="small" x="11" y="21" font-weight="700">Likes direct, warm replies</text>
        <rect class="green" x="286" y="7" width="38" height="18"/>
        <text class="xs" x="294" y="20" fill="#176049">88%</text>
      </g>
      <g transform="translate(14 88)">
        <rect class="soft" width="334" height="26"/>
        <text class="small muted" x="11" y="18" font-weight="700">Prefers examples before advice</text>
      </g>
    </g>
  </g>

  <g transform="translate(18 826)" filter="url(#shadow)">
    <rect class="card" width="394" height="320"/>
    <g transform="translate(18 26)">
      <text class="eyebrow" x="0" y="0">Memories</text>
      <text class="h2" x="0" y="32">Saved context about you</text>
      <text class="small muted" x="0" y="58">WhatsApp exports, profile notes, and bigger context.</text>
      <rect class="pill" x="0" y="78" width="84" height="28"/>
      <text class="xs muted" x="17" y="96">3 memories</text>
    </g>

    <g transform="translate(16 146)">
      <rect class="soft" width="362" height="58"/>
      <rect x="12" y="12" width="34" height="34" rx="8" fill="#eef8f3" stroke="#cfe1dc"/>
      <text class="xs" x="22" y="33" fill="#1f7664">Aa</text>
      <text class="small" x="58" y="25" font-weight="760">Import WhatsApp</text>
      <text class="xs muted" x="58" y="43">Use a chat export to learn tone</text>
    </g>

    <g transform="translate(16 214)">
      <rect class="soft" width="362" height="58"/>
      <rect x="12" y="12" width="34" height="34" rx="8" fill="#eef8f3" stroke="#cfe1dc"/>
      <text class="xs" x="24" y="33" fill="#1f7664">+</text>
      <text class="small" x="58" y="25" font-weight="760">Add memory</text>
      <text class="xs muted" x="58" y="43">Paste notes or important details</text>
    </g>

    <g transform="translate(16 282)">
      <rect class="soft" width="362" height="24"/>
      <text class="xs muted" x="12" y="16">Saved memory rows appear below actions</text>
    </g>
  </g>
</svg>
