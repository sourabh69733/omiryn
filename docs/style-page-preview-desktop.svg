<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">Omiryn Style page desktop preview</title>
  <desc id="desc">A clean two section desktop layout for learned signals and memories.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#315c56" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #18221f; }
      .muted { fill: #64736f; }
      .eyebrow { fill: #2f8b73; font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
      .h1 { font-size: 58px; font-weight: 820; }
      .h2 { font-size: 28px; font-weight: 780; }
      .h3 { font-size: 18px; font-weight: 760; }
      .copy { font-size: 18px; line-height: 1.5; }
      .small { font-size: 14px; }
      .xs { font-size: 12px; font-weight: 760; }
      .card { fill: #ffffff; stroke: #dce7e2; stroke-width: 1.4; rx: 8; }
      .soft { fill: #f7fbf9; stroke: #dce7e2; stroke-width: 1.2; rx: 8; }
      .pill { fill: #f2f7f4; stroke: #d8e5df; stroke-width: 1.2; rx: 999; }
      .green { fill: #e9f7f1; stroke: #bfe2d5; stroke-width: 1.2; rx: 999; }
      .amber { fill: #fff7dc; stroke: #ecd896; stroke-width: 1.2; rx: 999; }
      .divider { stroke: #e3ece7; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1440" height="1100" fill="url(#page)"/>

  <g transform="translate(80 44)">
    <rect width="1280" height="86" rx="28" fill="#ffffff" stroke="#e0eae5" filter="url(#shadow)"/>
    <circle cx="42" cy="43" r="18" fill="#1f7664"/>
    <text x="72" y="50" font-size="22" font-weight="840">Omiryn</text>
    <g transform="translate(640 28)" class="small">
      <text x="0" y="24" class="muted">Chat</text>
      <text x="86" y="24" font-weight="780">Style</text>
      <text x="172" y="24" class="muted">Matches</text>
      <text x="282" y="24" class="muted">Profile</text>
    </g>
    <rect x="1120" y="23" width="120" height="40" rx="999" fill="#f2f7f4" stroke="#d8e5df"/>
    <text x="1150" y="49" class="small" font-weight="780">Account</text>
  </g>

  <g transform="translate(120 180)">
    <text class="eyebrow" x="0" y="0">Style</text>
    <text class="h1" x="0" y="70">What Omiryn knows.</text>
    <text class="copy muted" x="0" y="112">A clean place to review learned signals and add memories that help Omiryn understand you better.</text>
  </g>

  <g transform="translate(120 345)" filter="url(#shadow)">
    <rect class="card" width="1200" height="410"/>
    <g transform="translate(30 34)">
      <text class="eyebrow" x="0" y="0">Learned signals</text>
      <text class="h2" x="0" y="40">Signals learned from your chats</text>
      <text class="small muted" x="0" y="70">Grouped by topic so you can quickly check what feels right, what changed, and what still needs context.</text>
      <rect class="pill" x="1038" y="-8" width="112" height="34"/>
      <text class="xs muted" x="1061" y="14">18 signals</text>
    </g>
    <line class="divider" x1="0" y1="120" x2="1200" y2="120"/>

    <g transform="translate(24 146)">
      <g>
        <rect class="card" width="374" height="230"/>
        <text class="h3" x="18" y="34">Values</text>
        <rect class="pill" x="326" y="16" width="30" height="24"/>
        <text class="xs muted" x="337" y="33">5</text>
        <g transform="translate(18 58)">
          <rect class="soft" width="338" height="48"/>
          <text class="small" x="14" y="29" font-weight="700">Prefers honesty over polished answers</text>
          <rect class="green" x="275" y="12" width="46" height="24"/>
          <text class="xs" x="286" y="29" fill="#176049">91%</text>
        </g>
        <g transform="translate(18 116)">
          <rect class="soft" width="338" height="48"/>
          <text class="small" x="14" y="29" font-weight="700">Trust grows through consistency</text>
          <rect class="green" x="275" y="12" width="46" height="24"/>
          <text class="xs" x="286" y="29" fill="#176049">84%</text>
        </g>
        <g transform="translate(18 174)">
          <rect class="soft" width="338" height="38"/>
          <text class="small muted" x="14" y="25" font-weight="700">Needs more evidence</text>
        </g>
      </g>

      <g transform="translate(388 0)">
        <rect class="card" width="374" height="230"/>
        <text class="h3" x="18" y="34">Communication</text>
        <rect class="pill" x="326" y="16" width="30" height="24"/>
        <text class="xs muted" x="337" y="33">7</text>
        <g transform="translate(18 58)">
          <rect class="soft" width="338" height="48"/>
          <text class="small" x="14" y="29" font-weight="700">Likes direct, warm replies</text>
          <rect class="green" x="275" y="12" width="46" height="24"/>
          <text class="xs" x="286" y="29" fill="#176049">88%</text>
        </g>
        <g transform="translate(18 116)">
          <rect class="soft" width="338" height="48"/>
          <text class="small" x="14" y="29" font-weight="700">Prefers examples before advice</text>
          <rect class="amber" x="275" y="12" width="46" height="24"/>
          <text class="xs" x="286" y="29" fill="#715410">62%</text>
        </g>
      </g>

      <g transform="translate(776 0)">
        <rect class="card" width="374" height="230"/>
        <text class="h3" x="18" y="34">Lifestyle</text>
        <rect class="pill" x="326" y="16" width="30" height="24"/>
        <text class="xs muted" x="337" y="33">6</text>
        <g transform="translate(18 58)">
          <rect class="soft" width="338" height="48"/>
          <text class="small" x="14" y="29" font-weight="700">Busy schedule, late replies are normal</text>
          <rect class="green" x="275" y="12" width="46" height="24"/>
          <text class="xs" x="286" y="29" fill="#176049">82%</text>
        </g>
        <g transform="translate(18 116)">
          <rect class="soft" width="338" height="48"/>
          <text class="small" x="14" y="29" font-weight="700">Values calm pacing</text>
          <rect class="amber" x="275" y="12" width="46" height="24"/>
          <text class="xs" x="286" y="29" fill="#715410">57%</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(120 795)" filter="url(#shadow)">
    <rect class="card" width="1200" height="230"/>
    <g transform="translate(30 34)">
      <text class="eyebrow" x="0" y="0">Memories</text>
      <text class="h2" x="0" y="40">Saved context about you</text>
      <text class="small muted" x="0" y="70">Add WhatsApp exports, profile notes, or any bigger context that should stay available across conversations.</text>
      <rect class="pill" x="1036" y="-8" width="114" height="34"/>
      <text class="xs muted" x="1058" y="14">3 memories</text>
    </g>
    <g transform="translate(30 128)">
      <rect class="soft" width="260" height="66"/>
      <rect x="16" y="15" width="36" height="36" rx="8" fill="#eef8f3" stroke="#cfe1dc"/>
      <text class="xs" x="27" y="38" fill="#1f7664">Aa</text>
      <text class="small" x="66" y="28" font-weight="760">Import WhatsApp</text>
      <text class="xs muted" x="66" y="48">Learn natural tone</text>

      <rect class="soft" x="280" width="260" height="66"/>
      <rect x="296" y="15" width="36" height="36" rx="8" fill="#eef8f3" stroke="#cfe1dc"/>
      <text class="xs" x="309" y="38" fill="#1f7664">+</text>
      <text class="small" x="346" y="28" font-weight="760">Add memory</text>
      <text class="xs muted" x="346" y="48">Paste notes or context</text>

      <rect class="soft" x="570" width="580" height="66"/>
      <text class="small" x="590" y="27" font-weight="760">My communication style</text>
      <text class="xs muted" x="590" y="48">WhatsApp style - 18,420 chars - remove</text>
    </g>
  </g>
</svg>
